# Publicação no Netlify (grátis). O Netlify compila o site sozinho a cada push no GitHub.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Qualquer endereço abre o site (links diretos de produto, etc.), com status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fotos e arquivos do site: cache longo (os nomes dos arquivos de código mudam a cada versão)
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
