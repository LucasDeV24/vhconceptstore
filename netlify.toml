# Publicação no Netlify (grátis). O Netlify compila o site sozinho a cada push no GitHub.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Sem "/* -> /index.html": cada página do site vira um arquivo no build (scripts/gerar-paginas.mjs),
# e endereços que não existem recebem a página 404.html com status 404 de verdade.

# Fotos e arquivos do site: cache longo (os nomes dos arquivos de código mudam a cada versão)
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
