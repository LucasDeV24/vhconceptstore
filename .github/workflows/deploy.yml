# Publica o site no GitHub Pages a cada push na branch main.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Em usuario.github.io/NOME-DO-REPO o site fica numa subpasta; em domínio próprio fica na raiz.
      # Para domínio próprio, crie a variável VITE_BASE = / em Settings > Secrets and variables > Actions > Variables.
      - name: Compilar
        env:
          VITE_BASE_VAR: ${{ vars.VITE_BASE }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$VITE_BASE_VAR" ]; then BASE="$VITE_BASE_VAR";
          elif [[ "$REPO" == *.github.io ]]; then BASE="/";
          else BASE="/$REPO/"; fi
          echo "Base do site: $BASE"
          VITE_BASE="$BASE" npm run build

      # O GitHub Pages usa o 404.html para abrir links diretos (ex.: .../produto/iphone-17-...)
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
